[SERVICE]
    Flush        1
    Log_Level    info
    Daemon       off

# 1️⃣ 读 Docker 容器日志
[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*-json.log
    Parser            docker
    Tag               docker.*
    Refresh_Interval  5
    Mem_Buf_Limit     10MB
    Skip_Long_Lines   On

# 2️⃣ 解析 Docker 元信息（重点：labels）
[FILTER]
    Name                docker
    Match               docker.*
    Merge_Log           On
    Keep_Log            Off
    Labels              On
    Annotations         Off

# 3️⃣ 输出到 Elasticsearch
[OUTPUT]
    Name            es
    Match           *
    Host            elasticsearch
    Port            9200
    Index           task-logs
    Logstash_Format Off
    Replace_Dots    On
