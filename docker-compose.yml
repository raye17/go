version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - D:/Docker/rabbitmq:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: test01
      MYSQL_USER: root
      MYSQL_PASSWORD: 123456
    volumes:
      - D:/Docker/mysql:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - D:/Docker/redis:/data
    restart: unless-stopped

  zookeeper:
    image: zookeeper:3.8
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=0.0.0.0:2888:3888
    volumes:
      - D:/Docker/zookeeper:/data
      - D:/docker/zookeeper_datalog:/datalog
    restart: unless-stopped


  
  filebrowser:
    container_name: filebrowser
    image: filebrowser/filebrowser:latest
    restart: always
#    depends_on:
#      - mariadb
    volumes:
      - D:\Docker\filebrowser\srv:/srv
      - D:\Docker\filebrowser\config\config.json:/etc/config.json
      - D:\Docker\filebrowser\db\database.db:/etc/database.db
#    environment:
#      - DB_HOST=mariadb
#      - DB_USER=admin
#      - DB_PASS=admin
#      - DB_NAME=notepad
#      - DB_PORT=3306
#      - PGID=1000
#      - PUID=1000
#      - TZ=Aisa/Shanghai
    #ports:
     # - "8899:80"
    networks:
      - my-network

    
  nginx:     
   image: nginx:latest     
   container_name: my-nginx     
   ports:     
     - "8017:80"     
   volumes:       
    - D:/Docker/nginx/nginx.conf:/etc/nginx/nginx.conf
    - D:/Docker/nginx/html:/usr/share/nginx/html        
   restart: unless-stopped     
   networks:       
     - my-network 

networks:   
    my-network:     
        driver: bridge