#version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - D:/Docker/rabbitmq:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: root
      RABBITMQ_DEFAULT_PASS: 123456
    restart: unless-stopped

  # mysql:
  #   image: mysql:8.0
  #   container_name: mysql
  #   ports:
  #     - "3307:3306"
  #   environment:
  #     MYSQL_ROOT_PASSWORD: 123456
  #     MYSQL_DATABASE: test01
  #     MYSQL_USER: root
  #     MYSQL_PASSWORD: 123456
  #   volumes:
  #     - D:/Docker/mysql:/var/lib/mysql
  #   restart: unless-stopped
  #   networks:       
  #    - my-network 

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456  # Ensure this matches the password in SQL_DSN
      MYSQL_DATABASE: yourapi
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"  
  
  zookeeper:
    image: zookeeper:3.8
    #image: image-in.fontree.cn/zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    # environment:
    #   ZOO_MY_ID: 1
    #   ZOO_SERVERS: server.1=0.0.0.0:2888:3888
    volumes:
      - D:/Docker/zookeeper:/data
      - D:/docker/zookeeper_datalog:/datalog
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - D:/Docker/redis:/data
    restart: unless-stopped


  yourapi:
    image: yourapi/yourapi:latest
    container_name: yourapi
    restart: always
    command: --log-dir /app/logs
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - SQL_DSN=root:123456@tcp(host.docker.internal:3306)/yourapi?charset=utf8mb4&parseTime=True&loc=Local  # 修改此行，或注释掉以使用 SQLite 作为数据库
      - REDIS_CONN_STRING=redis://redis # 也可以自定义，例如 redis://user:password@localhost:6379/0
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true # 是否启用错误日志记录
    #      - TIKTOKEN_CACHE_DIR=./tiktoken_cache  # 如果需要使用tiktoken_cache，请取消注释
    #      - SESSION_SECRET=random_string  # 多机部署时设置，必须修改这个随机字符串！！！！！！！
    #      - NODE_TYPE=slave  # Uncomment for slave node in multi-node deployment
    #      - SYNC_FREQUENCY=60  # Uncomment if regular database syncing is needed
    #      - FRONTEND_BASE_URL=https://openai.justsong.cn  # Uncomment for multi-node deployment with front-end URL

    depends_on:
      - redis
      #- mysql
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' | awk -F: '{print $$2}'"]
      interval: 30s
      timeout: 10s
      retries: 3 

  
  filebrowser:
    container_name: filebrowser
    image: filebrowser/filebrowser:latest
    restart: always
#    depends_on:
#      - mariadb
    volumes:
      - D:\Docker\filebrowser\srv:/srv
      - D:\Docker\filebrowser\config\config.json:/etc/config.json
      - D:\Docker\filebrowser\db\database.db:/etc/database.db
#    environment:
#      - DB_HOST=mariadb
#      - DB_USER=admin
#      - DB_PASS=admin
#      - DB_NAME=notepad
#      - DB_PORT=3306
#      - PGID=1000
#      - PUID=1000
#      - TZ=Aisa/Shanghai
    #ports:
     # - "8899:80"
    networks:
      - my-network

    
  nginx:     
   image: nginx:latest     
   container_name: my-nginx     
   ports:     
     - "8017:80"     
   volumes:       
    - D:/Docker/nginx/nginx.conf:/etc/nginx/nginx.conf
    - D:/Docker/nginx/html:/usr/share/nginx/html        
   restart: unless-stopped     
   networks:       
     - my-network 


  syncthing:
    image: syncthing/syncthing:latest
    container_name: syncthing
    ports:
      - "8384:8384"      # Web GUI
      - "22000:22000/tcp" # 设备通信端口 TCP
      - "22000:22000/udp" # 设备通信端口 UDP（穿透用）
    volumes:
      - ./tmp/config:/var/syncthing/config   # 配置文件持久化
      - ./tmp/data:/var/syncthing/data       # 同步数据目录
    restart: unless-stopped

  watchyourports:
    image: aceberg/watchyourports:latest  # 替换为镜像地址
    container_name: watchyourports
    restart: unless-stopped
    ports:
      - "8355:8853"  # 前端访问端口
      - "5000:5000"  # API端口(如果需要)
    volumes:
      - D:/Docker/watchyourports/data:/app/data  # 持久化数据存储
    environment:
      - TZ=Asia/Shanghai  # 设置时区
      - WYP_CONFIG=/app/data/config.yaml  # 配置文件路径
    networks:
      - my-network

networks:   
    my-network:     
        driver: bridge


volumes:
  mysql_data: